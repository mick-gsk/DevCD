site_name: DevCD
site_description: Local-first context layer that warm-starts every AI agent session with a policy-filtered Action Packet — no recap requests, no context loss.
site_url: https://mick-gsk.github.io/DevCD/
repo_url: https://github.com/mick-gsk/DevCD
repo_name: mick-gsk/DevCD
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/devcd-mark.svg
  favicon: assets/devcd-mark.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  custom_dir: docs/overrides
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit

extra_css:
  - assets/devcd-brand-tokens.css
  - assets/brand.css

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Use Cases: use-cases.md
  - Architecture:
      - Overview: devcd/architecture.md
      - Memory Model: devcd/memory.md
      - Policy Layer: devcd/policy.md
      - Agent Consumption: devcd/agent-consumption.md
      - Agent Landscape: devcd/agent-landscape.md
      - OpenClaw Integration: devcd/openclaw-integration.md
      - OpenClaw Product Benchmark: devcd/openclaw-product-benchmark.md
      - Context Packs: devcd/context-packs.md
      - Brand System: devcd/brand-system.md
      - Naming and Positioning: devcd/naming-and-positioning.md
      - Release Readiness: devcd/release-readiness.md
      - Publishing: devcd/publishing.md
      - Container Sandbox: devcd/container.md
      - Event Source Recipes: devcd/event-source-recipes.md
      - Agent Vision: devcd/agent-vision.md
  - Decisions:
      - ADR-001 Vertical Slice Architecture: decisions/ADR-001-vertical-slice-architecture.md
      - ADR-012 Public Alpha Agent Passport Surface: decisions/ADR-012-public-alpha-agent-passport-surface.md
