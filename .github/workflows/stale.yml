name: Stale

on:
  schedule:
    - cron: "0 8 * * 1"  # Every Monday at 08:00 UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # Issues
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-label: "stale"
          stale-issue-message: >
            This issue has been open without activity for 60 days and is now
            marked stale. It will be closed in 14 days unless there is further
            activity. If this is still relevant, please leave a comment or remove
            the stale label.
          close-issue-message: >
            Closing due to inactivity. Please reopen if this is still relevant.

          # Pull requests
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-pr-label: "stale"
          stale-pr-message: >
            This pull request has been open without activity for 30 days and is
            now marked stale. It will be closed in 7 days unless there is further
            activity.
          close-pr-message: >
            Closing due to inactivity. Please reopen if you want to continue.

          # Never mark these
          exempt-issue-labels: "priority/high,pinned,security"
          exempt-pr-labels: "priority/high,pinned,security"
