name: Publish TestPyPI

"on":
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to publish to TestPyPI, usually a release candidate tag such as v0.1.0rc1"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build, verify, and publish to TestPyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ inputs.ref }}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run full checks
        run: make check

      - name: Build and verify distribution
        run: make distribution

      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/