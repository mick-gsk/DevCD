name: Self-Heal via Copilot

# Self-healing loop powered by the GitHub Copilot coding agent:
#
#   push → CI/Deploy Docs fails
#     → this workflow collects the failure logs
#     → creates a GitHub Issue with full context
#     → assigns Copilot to the issue
#     → Copilot analyzes, creates a fix PR
#     → PR merged → CI runs again → passes
#
# Circuit breakers (prevent infinite loops):
#   1. Only fires on the `main` branch
#   2. Only on the first CI attempt (run_attempt < 2)
#   3. Skips commits already tagged [self-heal] or [copilot-fix]
#   4. Does not open a second issue if one with the same run-id already exists

on:
  workflow_run:
    workflows: [CI, Deploy Docs]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  assign-copilot:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.run_attempt < 2 &&
      !contains(github.event.workflow_run.head_commit.message, '[self-heal]') &&
      !contains(github.event.workflow_run.head_commit.message, '[copilot-fix]')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Check for existing issue
        id: existing
        run: |
          COUNT=$(gh issue list \
            --repo "$REPO" \
            --state open \
            --search "CI Self-Heal run:$RUN_ID" \
            --json number \
            --jq length)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Fetch failure logs
        if: steps.existing.outputs.count == '0'
        id: logs
        run: |
          gh run view "$RUN_ID" \
            --repo "$REPO" \
            --log-failed 2>&1 \
            | head -n 250 > logs.txt || echo "(Could not retrieve logs)" > logs.txt

      - name: Create issue
        if: steps.existing.outputs.count == '0'
        id: issue
        run: |
          COMMIT_MSG=$(echo "${{ github.event.workflow_run.head_commit.message }}" | head -n 1)
          LOGS=$(cat logs.txt)
          BODY=$(cat <<BODY
          ## CI Failure — ${{ github.event.workflow_run.name }}

          | Field | Value |
          |---|---|
          | **Workflow** | ${{ github.event.workflow_run.name }} |
          | **Branch** | \`${{ github.event.workflow_run.head_branch }}\` |
          | **Commit** | \`${{ github.event.workflow_run.head_sha }}\` — ${COMMIT_MSG} |
          | **Run** | [View run](${{ github.event.workflow_run.html_url }}) (run:${RUN_ID}) |
          | **Attempt** | ${{ github.event.workflow_run.run_attempt }} |

          ### Failure Logs

          \`\`\`
          ${LOGS}
          \`\`\`

          ---
          Please analyze the failure logs, identify the root cause, and push a fix.
          Include \`[self-heal]\` in the commit message so the self-heal loop stops.
          BODY
          )

          ISSUE_URL=$(gh issue create \
            --repo "$REPO" \
            --title "fix: CI Self-Heal run:${RUN_ID} — ${{ github.event.workflow_run.name }} failed" \
            --body "$BODY" \
            --label "bug")

          ISSUE_NUMBER=$(echo "$ISSUE_URL" | grep -oE '[0-9]+$')
          echo "number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Created issue #$ISSUE_NUMBER: $ISSUE_URL"

      - name: Assign Copilot
        if: steps.existing.outputs.count == '0'
        run: |
          gh issue edit ${{ steps.issue.outputs.number }} \
            --repo "$REPO" \
            --add-assignee "@copilot"

