name: Publish PyPI

"on":
  # Triggered automatically by Release Please when it creates a GitHub Release.
  release:
    types: [published]
  # Manual fallback: specify an exact tag such as v0.2.0 to publish.
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to publish, usually a signed release tag such as v0.1.0"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build, verify, and publish to PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # On release events use the tag that triggered the release;
          # on manual dispatch use the explicitly provided ref.
          ref: "${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref }}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run full checks
        run: make check

      - name: Build and verify distribution
        run: make distribution

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
