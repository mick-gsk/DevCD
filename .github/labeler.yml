          - "docs/devcd/context-packs.md"
          - "examples/context-packs/**"

"devcd/agentic-context":
  - changed-files:
      - any-glob-to-any-file:
          - "packages/devcd-core/src/devcd/slices/agentic_context/**"

"devcd/policy-layer":
