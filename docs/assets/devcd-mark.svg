<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">DevCD mark</title>
  <desc id="desc">A compact pixel-built DevCD terminal mark.</desc>
  <defs>
    <rect id="px" width="7" height="7" rx="1" fill="currentColor"/>
    <g id="d-pixels">
      <use href="#px" x="0" y="0"/><use href="#px" x="8" y="0"/><use href="#px" x="16" y="0"/>
      <use href="#px" x="0" y="8"/><use href="#px" x="24" y="8"/><use href="#px" x="0" y="16"/><use href="#px" x="24" y="16"/><use href="#px" x="0" y="24"/><use href="#px" x="24" y="24"/><use href="#px" x="0" y="32"/><use href="#px" x="24" y="32"/>
      <use href="#px" x="0" y="40"/><use href="#px" x="8" y="40"/><use href="#px" x="16" y="40"/>
    </g>
  </defs>
  <rect width="96" height="96" rx="18" fill="#080a0f"/>
  <rect x="9" y="9" width="78" height="78" rx="12" fill="none" stroke="#263142" stroke-width="2"/>
  <use href="#d-pixels" x="24" y="25" color="#080a0f" transform="translate(4 5)" opacity="0.95"/>
  <use href="#d-pixels" x="24" y="25" color="#9b5419" transform="translate(2 3)" opacity="0.95"/>
  <use href="#d-pixels" x="24" y="25" color="#f7c948"/>
  <path d="M24 73h48" stroke="#18b7a6" stroke-width="5" stroke-linecap="square"/>
</svg>
