<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">DevCD — Your AI Never Forgets</title>
  <desc id="desc">DevCD mascot social card — local-first agent continuity daemon.</desc>
  <defs>
    <!-- Amber halo glow around the daemon -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="28" result="b"/>
      <feFlood flood-color="#f7c948" flood-opacity="0.42" result="c"/>
      <feComposite in="c" in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
            <radialGradient id="card-body-shade" cx="42%" cy="26%" r="78%">
                  <stop offset="0%" stop-color="#fff0bf"/>
                  <stop offset="56%" stop-color="#f7c948"/>
                  <stop offset="100%" stop-color="#c97821"/>
            </radialGradient>
            <radialGradient id="card-eye-core" cx="38%" cy="34%" r="70%">
                  <stop offset="0%" stop-color="#68ead8"/>
                  <stop offset="100%" stop-color="#18b7a6"/>
            </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0c12"/>

  <!-- Soft ambient light around daemon position -->
  <ellipse cx="252" cy="310" rx="290" ry="310" fill="#f7c948" opacity="0.03"/>

  <!-- ── Daemon mascot (left panel, centered) ──
       Ghost-daemon shape built from bezier curves.
       Local bounding box: x 60–240 (180px), y 55–310 (255px)
       Scaled 1.9×, translated so it is centered in the 505px left panel.
       Center x = 180*1.9/2 + offset ≈ 252, center y ≈ 310.
  -->
  <g transform="translate(-33,-27) scale(1.9)" filter="url(#glow)">

    <!-- Body: dome top + straight sides + 3 wavy bumps at bottom -->
    <path d="
      M 60,265
      L 60,170
      C 60,90 90,55 150,55
      C 210,55 240,90 240,170
      L 240,265
      C 216,308 204,308 180,265
      C 156,308 144,308 120,265
      C  96,308  84,308  60,265
      Z"
      fill="url(#card-body-shade)"/>

    <!-- Top rim highlight -->
    <path d="M 74,160 C 80,92 105,66 150,64 C 195,66 220,92 226,160"
          fill="none" stroke="#ffe9a9" stroke-width="6" stroke-linecap="round" opacity="0.28"/>

    <!-- Belly depth shadow -->
    <path d="M 84,246 C 110,273 190,273 216,246 L 216,272 L 84,272 Z"
          fill="#b46f1e" opacity="0.24"/>

    <!-- Left eye (dark oval with teal glow) -->
    <circle cx="120" cy="182" r="21" fill="#080a0f"/>
    <circle cx="128" cy="175" r="9"  fill="url(#card-eye-core)"/>
    <circle cx="124" cy="170" r="2.8" fill="#d7fff6" opacity="0.86"/>

    <!-- Right eye -->
    <circle cx="180" cy="182" r="21" fill="#080a0f"/>
    <circle cx="188" cy="175" r="9"  fill="url(#card-eye-core)"/>
    <circle cx="184" cy="170" r="2.8" fill="#d7fff6" opacity="0.86"/>

    <!-- Smirk — slight asymmetric personality -->
    <path d="M 132,224 Q 151,242 168,222"
          fill="none" stroke="#080a0f" stroke-width="6" stroke-linecap="round"/>

    <!-- Smirk highlight -->
    <path d="M 136,220 Q 150,232 164,220"
          fill="none" stroke="#ffd66e" stroke-width="2.4" stroke-linecap="round" opacity="0.42"/>

    <!-- Tiny horns — daemon identity marker -->
    <path d="M 100,68 L 90,30 L 116,60"  fill="url(#card-body-shade)"/>
    <path d="M 200,68 L 210,30 L 184,60" fill="url(#card-body-shade)"/>
  </g>

  <!-- Amber separator between panels -->
  <rect x="502" y="24" width="3" height="582" fill="#f7c948" opacity="0.55"/>

  <!-- ── Right panel: text ── -->
  <!-- Product label -->
  <text x="532" y="66"
        font-family="Cascadia Mono, Consolas, Menlo, monospace"
        font-size="15" letter-spacing="5" fill="#344054">devcd</text>

  <!-- Three-line hero statement -->
  <text x="532" y="258"
        font-family="Cascadia Mono, Consolas, Menlo, monospace"
        font-size="106" font-weight="900" letter-spacing="-2"
        fill="#d9e2ec">YOUR AI</text>

  <text x="532" y="382"
        font-family="Cascadia Mono, Consolas, Menlo, monospace"
        font-size="106" font-weight="900" letter-spacing="-2"
        fill="#d9e2ec">NEVER</text>

  <text x="532" y="506"
        font-family="Cascadia Mono, Consolas, Menlo, monospace"
        font-size="106" font-weight="900" letter-spacing="-2"
        fill="#f7c948">FORGETS<tspan fill="#18b7a6">.</tspan></text>

  <!-- Attribution -->
  <text x="532" y="596"
        font-family="Cascadia Mono, Consolas, Menlo, monospace"
        font-size="14" letter-spacing="1" fill="#263142">github.com/mick-gsk/DevCD  ·  local-first  ·  open source</text>
</svg>
