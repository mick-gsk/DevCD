[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "devcd"
version = "0.1.0"
description = "Local developer context daemon with explicit state, memory, and policy layers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
  { name = "Mick Gottschalk" },
]
keywords = [
  "developer-tools",
  "context-daemon",
  "agentic-development",
  "local-first",
  "memory-layer",
  "policy-engine",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/mick-gsk/DevCD"
Repository = "https://github.com/mick-gsk/DevCD"
Documentation = "https://mick-gsk.github.io/DevCD/"
Issues = "https://github.com/mick-gsk/DevCD/issues"
Changelog = "https://github.com/mick-gsk/DevCD/blob/main/CHANGELOG.md"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "tomli-w>=1.0",
  "typer>=0.12",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]
docs = [
  "mkdocs-material>=9.5",
  "pymdown-extensions>=10.8",
]

[project.scripts]
devcd = "devcd.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["packages/devcd-core/src/devcd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages/devcd-core/src"]
addopts = "--strict-markers"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["packages/devcd-core/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
strict_equality = true
check_untyped_defs = true
ignore_missing_imports = true
